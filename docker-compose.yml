services:
  web:
    build: ./frontend
    environment:
      # Route handlers call the backend over the internal Docker network (no internet hop, no CORS).
      ASTERRA_API_URL: http://api:8000/api/v1
    restart: unless-stopped
    logging: { options: { max-size: "10m", max-file: "3" } }

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ASTERRA_CACHE_DIR: /data/cache
    restart: unless-stopped
    volumes:
      - api_cache:/data/cache
    logging: { options: { max-size: "10m", max-file: "3" } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    logging: { options: { max-size: "10m", max-file: "3" } }

volumes:
  api_cache:
  caddy_data:
  caddy_config:
