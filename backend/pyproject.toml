[project]
name = "asterra-backend"
version = "0.1.0"
description = "ASTERRA backend: NASA data orchestration + crop rotation decision support (NASA Space Apps 2026, Field Shift)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tenacity>=9.0",          # retries for flaky NASA endpoints
    "diskcache>=5.6",         # cache survives `--reload` restarts (POWER calls are slow)
    "shapely>=2.0",           # field polygon validation + centroid
    "pyproj>=3.6",            # geodesic field area in hectares
]

[project.optional-dependencies]
# Heavier geospatial stack. Install only when you start on these providers:
#   uv sync --extra geo
geo = [
    "earthengine-api>=1.1",   # Sentinel-2 / MODIS NDVI, SRTM slope via Google Earth Engine
    "earthaccess>=0.11",      # NASA Earthdata login + SMAP / GPM IMERG granules
    "xarray>=2024.7",
    "rasterio>=1.3",
    "rioxarray>=0.17",
]
llm = [
    "anthropic>=0.40",        # optional: explanations only, never numeric rankings
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",            # mock httpx calls to NASA in tests
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Body"]
